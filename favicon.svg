<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="60%" stop-color="#804dee"/>
      <stop offset="100%" stop-color="#00CEA8"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151030"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
  </defs>
  
  <!-- Outer dark background circle with violet neon border -->
  <circle cx="32" cy="32" r="30" fill="url(#darkBg)" stroke="url(#neonGradient)" stroke-width="2.5"/>
  
  <!-- Futuristic M monogram -->
  <path d="M 17 44 L 17 21 L 27 34 L 32 27 L 37 34 L 47 21 L 47 44" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Glowing neon core -->
  <circle cx="32" cy="41" r="2.5" fill="#00CEA8"/>
</svg>
